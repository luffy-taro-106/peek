name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and zip
        run: make zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION)"
          gh release create "$GITHUB_REF_NAME" "build/Peek-$VERSION.zip" \
            --title "Peek $GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for what's new. This build isn't notarized: the first time, right-click Peek.app → Open."
